 roman_restoration:0 "罗马复兴主义"
 roman_restoration_desc:0 "以罗马公民身份、帝国法统和国家复兴为基础的政治运动。"
 rr.0.0:0 "帝国派正式登场。"
 rr.0.d:0 "将军、学者和流亡者聚集在双头鹰之下。他们所拥戴的君士坦丁十一世将以旧帝国的记忆，为这个现代国家寻找新的道路。复兴已经有了旗帜，接下来需要制度、工业与人民的支持。"
 rr.0.t:0 "紫衣重临"
 rr.1.0:0 "王冠与双头鹰。"
 rr.1.1:0 "执政官将成为巴西琉斯。"
 rr.1.d:0 "帝国复兴纲领公布已有三十五日。军官、教会与市民代表终于坐到一起：帝国应以公投恢复王冠，还是由执政官领导运动夺取权力？无论选择何者，旧秩序都已不能回应这个国家的愿望。"
 rr.1.t:0 "帝国问题"
 rr.11.0:0 "中央集权军区制。"
 rr.11.1:0 "新普罗尼亚体系。"
 rr.11.d:0 "征服不能替代制度。军区官员主张将税收和征兵纳入中央编制，另一批代表则希望以服役义务换取地方经营权。两种安排都能维持帝国，却将塑造不同的国家。"
 rr.11.t:0 "帝国应如何治理"
 rr.12.0:0 "让争论留在议事厅，让秩序遍及行省。"
 rr.12.d:0 "将军、行省代表与元老终于在同一份法令上留下姓名。国家不再依赖一次次紧急命令维持统治，皇帝的权威与议会的职责有了明确边界。昔日争夺政府的派系，将在制度之内争论。"
 rr.12.t:0 "帝国宪制确立"
 rr.13.0:0 "君士坦丁堡仍是帝国之心。"
 rr.13.1:0 "让元老院与人民重返罗马。"
 rr.13.d:0 "旧罗马与新罗马都已回到同一面旗帜之下。重建帝国的宣告将从哪座城市发出？这个选择不仅关乎历史，也将决定下一轮公共建设和人口投入的方向。"
 rr.13.t:0 "罗马帝国的首都"
 rr.14.0:0 "让知识成为公民共同的财富。"
 rr.14.d:0 "从地方学校到帝国大学，新的课程、教师训练和教育行政终于连成一个体系。它不会在一夜之间改变社会，但每一届学生都将使国家更有能力理解和运用现代科学。"
 rr.14.t:0 "国家教育体系建立"
 rr.15.0:0 "优先陆战研究。"
 rr.15.1:0 "优先海军研究。"
 rr.15.2:0 "优先航空研究。"
 rr.15.d:0 "筹备工作已经完成。研究委员会建议集中有限的设备与人员，先建成一座能够承担特别项目的实验设施。"
 rr.15.t:0 "国家实验室的研究方向"
 rr.2.0:0 "以人民的授权，迎回紫衣。"
 rr.2.d:0 "选票已经清点完毕。支持复兴的声音汇聚为新的授权，君士坦丁十一世将以皇帝之名承担国家的命运。议会与军队承认结果，接下来必须让承诺变成治理。"
 rr.2.t:0 "国民的裁决"
 rr.20.0:0 "意大利不会交出自己的主权。"
 rr.20.1:0 "接受协定，交接意大利本土。"
 rr.20.d:0 "拜占庭提出西部帝冠协定：意大利交接本土地区，保留海外属地。接受意味着终止半岛上的主权争端；拒绝将使历史争论转化为军事对抗。"
 rr.20.t:0 "西部帝冠协定"
 rr.3.0:0 "让秩序带来复兴。"
 rr.3.d:0 "整肃留下的恐惧正在消退。军队重新接受统一指挥，地方官署恢复运作，帝国政府终于能够把注意力从权力争夺转向国家重建。"
 rr.3.t:0 "秩序重建"
 rr.30.0:0 "支持校勘与研究。"
 rr.30.1:0 "让知识走向公众。"
 rr.30.d:0 "整理古籍的学者和主持公开讲学的教师都请求得到支持。前者希望将旧知识转化为现代研究，后者希望让更多公民理解复兴的共同事业。国家可以维持基础经费，但这一次专项拨款必须确定重点。"
 rr.30.t:0 "书斋与广场"
 rr.31.0:0 "支持电子与通信研究。"
 rr.31.1:0 "支持工业工程研究。"
 rr.31.d:0 "归来的学者带来了手稿、实验记录和在海外积累的经验。有人希望先建立电子与通信研究团队，另一些人则主张把有限经费用于工业工程。两条道路都能服务复兴，现在需要确定第一笔拨款的用途。"
 rr.31.t:0 "归国学者的研究方向"
 rr.32.0:0 "发展商旅与集市。"
 rr.32.1:0 "支持朝圣与地方建设。"
 rr.32.d:0 "港口迎来了商人、学者与朝圣者。旅馆和市场希望把新客流转化为贸易，地方官署则建议把收入投入岛屿道路与公共设施。旅游的繁荣有赖于和平，而如何使用它的收益，将由我们决定。"
 rr.32.t:0 "旅人带来了什么？"
 rr.33.0:0 "先让税粮进入仓库。"
 rr.33.1:0 "登记军户，准备服役。"
 rr.33.d:0 "田籍已经完成整理。财政官希望以更稳定的税粮供应减轻国库负担，军务官则建议在保障土地经营的同时登记可供征召的军户。新增的行政能力足以推进其中一项改革。"
 rr.33.t:0 "田籍上的人民"
 rr.5.0:0 "土耳其不会向旧帝国低头。"
 rr.5.1:0 "接受协定，避免战争。"
 rr.5.d:0 "雅典的帝国政府要求我们承认拜占庭的历史正统，交出东色雷斯、伊斯坦布尔以及划定的爱琴海沿岸地区。使者明确表示，拒绝将意味着立即开战。这不是一封可以无限搁置的照会。"
 rr.5.t:0 "来自雅典的正统要求"
 rr.6.0:0 "帝国将为自己的要求而战。"
 rr.6.d:0 "安卡拉拒绝了帝国的要求。边境部队已经接到命令，第一次光复战争开始了。街头的集会与新征召的队伍表明，故土的记忆仍能动员这个国家。"
 rr.6.t:0 "交涉破裂"
 rr.7.0:0 "旧日的名字，新的国家。"
 rr.7.d:0 "双头鹰再度俯瞰博斯普鲁斯海峡。政府宣布以拜占庭之名延续国家，安纳托利亚故土也被正式纳入帝国的核心领土纲领。"
 rr.7.t:0 "新罗马再临"
 rr.8.0:0 "让交接有序进行。"
 rr.8.d:0 "土耳其政府接受了领土协定。交接委员会将进入东色雷斯与爱琴海沿岸，帝国必须以行政能力证明，它能够治理刚刚接收的土地。"
 rr.8.t:0 "安卡拉接受协定"
