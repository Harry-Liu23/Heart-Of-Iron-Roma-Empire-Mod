l_simp_chinese:
 RR_GRE_awaken_the_purple_phoenix: "唤醒紫凤凰"
 RR_GRE_awaken_the_purple_phoenix_desc: "希腊国家并非我们历史的终点，而是罗马人的帝国得以重生的载体。"
 RR_GRE_claim_new_rome: "世界渴望之城"
 RR_GRE_claim_new_rome_desc: "君士坦丁堡是帝国的心脏。没有新罗马，帝国复兴便只是一句空洞的口号。"
 RR_GRE_restore_constantinople: "光复君士坦丁堡"
 RR_GRE_restore_constantinople_desc: "双头鹰再次飞翔于博斯普鲁斯海峡之上。君士坦丁堡将再度成为罗马世界的首都。"
 RR_GRE_claim_the_balkans: "收复巴尔干行省"
 RR_GRE_claim_the_balkans_desc: "北方的道路曾将帝国的城市、军队与市场连为一体。整个半岛必须重新归于罗马权威。"
 RR_GRE_restore_the_balkan_provinces: "重组巴尔干行省"
 RR_GRE_restore_the_balkan_provinces_desc: "仅凭征服无法重建帝国。我们将重组地方行政，使这些土地重新听命于君士坦丁堡。"
 RR_GRE_reconquer_asia_minor: "再征服小亚细亚"
 RR_GRE_reconquer_asia_minor_desc: "几个世纪以来，安纳托利亚一直是罗马兵员与粮食的源泉。收复这里是帝国长治久安的基础。"
 RR_GRE_restore_the_anatolian_themes: "恢复安纳托利亚军区"
 RR_GRE_restore_the_anatolian_themes_desc: "军区制度将安纳托利亚腹地与帝国中枢紧密结合，把新收复的土地转化为帝国力量。"
 RR_GRE_return_to_antioch: "重返安条克"
 RR_GRE_return_to_antioch_desc: "越过托罗斯山脉便是安条克——昔日帝国最伟大的城市之一，也是通往叙利亚的门户。"
 RR_GRE_restore_the_levant: "重建黎凡特行省"
 RR_GRE_restore_the_levant_desc: "叙利亚海岸与安条克已经获得解放，帝国行政机构可以重返东地中海。"
 RR_GRE_reclaim_the_holy_land: "收复圣地"
 RR_GRE_reclaim_the_holy_land_desc: "耶路撒冷不能继续置身于复兴罗马国家的保护之外。"
 RR_GRE_reclaim_aegyptus: "收复埃及行省"
 RR_GRE_reclaim_aegyptus_desc: "亚历山大里亚与尼罗河曾是帝国不可或缺的一部分。埃及将再次供养君士坦丁堡并控制南方海域。"
 RR_GRE_mare_nostrum: "我们的海"
 RR_GRE_mare_nostrum_desc: "从爱琴海到亚历山大里亚，东地中海已尽归我手。大海再次成为帝国的通衢。"
 RR_GRE_return_to_italy: "重返意大利"
 RR_GRE_return_to_italy_desc: "复兴不能止步于东方。帝国古老的心脏正位于亚得里亚海彼岸。"
 RR_GRE_reclaim_old_rome: "收复旧罗马"
 RR_GRE_reclaim_old_rome_desc: "新罗马解放了旧罗马，两座帝国首都在数百年后终于再次统一。"
 RR_GRE_restore_the_roman_empire: "重建罗马帝国"
 RR_GRE_restore_the_roman_empire_desc: "我们的胜利已经超越了复兴之梦。从罗马到君士坦丁堡，罗马帝国重归人世。"

 RR_GRE_purple_phoenix_1: "紫凤凰之梦"
 RR_GRE_purple_phoenix_1_desc: "帝国复兴的理念重新进入公共生活，但它目前仍然只是一个尚未兑现的承诺。"
 RR_GRE_purple_phoenix_2: "紫凤凰升起"
 RR_GRE_purple_phoenix_2_desc: "随着君士坦丁堡重归首都，帝国事业正在国内外赢得越来越多的忠诚。"
 RR_GRE_purple_phoenix_3: "帝国复兴"
 RR_GRE_purple_phoenix_3_desc: "收复的行省带来了士兵、资源，也证明罗马的复兴已经不可逆转。"
 RR_GRE_purple_phoenix_4: "不可征服的罗马"
 RR_GRE_purple_phoenix_4_desc: "帝国跨越数个世纪并凯旋归来。罗马永不陷落。"

