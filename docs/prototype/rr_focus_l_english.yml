l_english:
 RR_GRE_awaken_the_purple_phoenix: "Awaken the Purple Phoenix"
 RR_GRE_awaken_the_purple_phoenix_desc: "The Greek state is not the end of our history. It is the vessel through which the empire of the Romans may rise again."
 RR_GRE_claim_new_rome: "The City of the World's Desire"
 RR_GRE_claim_new_rome_desc: "Constantinople is the heart of the empire. Without New Rome, imperial restoration is no more than an empty slogan."
 RR_GRE_restore_constantinople: "Restore Constantinople"
 RR_GRE_restore_constantinople_desc: "The double-headed eagle flies above the Bosporus once more. Constantinople shall again be the capital of the Roman world."
 RR_GRE_claim_the_balkans: "Recover the Balkan Provinces"
 RR_GRE_claim_the_balkans_desc: "The roads north once connected imperial cities, armies, and markets. The peninsula must be brought back beneath Roman authority."
 RR_GRE_restore_the_balkan_provinces: "Reorganize the Balkan Provinces"
 RR_GRE_restore_the_balkan_provinces_desc: "Conquest alone cannot restore an empire. Local administrations will be reorganized and tied to Constantinople."
 RR_GRE_reconquer_asia_minor: "Reconquer Asia Minor"
 RR_GRE_reconquer_asia_minor_desc: "Anatolia was the reservoir of Roman soldiers and grain for centuries. Its recovery is essential to any lasting restoration."
 RR_GRE_restore_the_anatolian_themes: "Restore the Anatolian Themes"
 RR_GRE_restore_the_anatolian_themes_desc: "Military districts will bind the Anatolian interior to the imperial center and turn reconquered lands into a source of strength."
 RR_GRE_return_to_antioch: "Return to Antioch"
 RR_GRE_return_to_antioch_desc: "Beyond the Taurus lies Antioch, one of the great cities of the old empire and the gateway to Syria."
 RR_GRE_restore_the_levant: "Restore the Levantine Provinces"
 RR_GRE_restore_the_levant_desc: "The Syrian coast and Antioch have been secured. Imperial administration can now return to the eastern Mediterranean."
 RR_GRE_reclaim_the_holy_land: "Reclaim the Holy Land"
 RR_GRE_reclaim_the_holy_land_desc: "Jerusalem cannot remain outside the protection of the restored Roman state."
 RR_GRE_reclaim_aegyptus: "Reclaim Aegyptus"
 RR_GRE_reclaim_aegyptus_desc: "Alexandria and the Nile were once indispensable to the empire. Egypt will again feed Constantinople and command the southern sea."
 RR_GRE_mare_nostrum: "Mare Nostrum"
 RR_GRE_mare_nostrum_desc: "From the Aegean to Alexandria, the eastern Mediterranean is ours. The sea has again become the empire's great highway."
 RR_GRE_return_to_italy: "Return to Italy"
 RR_GRE_return_to_italy_desc: "The restoration cannot end in the East. The old heartland of the empire lies across the Adriatic."
 RR_GRE_reclaim_old_rome: "Reclaim Old Rome"
 RR_GRE_reclaim_old_rome_desc: "New Rome has liberated Old Rome. The two imperial capitals are united for the first time in centuries."
 RR_GRE_restore_the_roman_empire: "Restore the Roman Empire"
 RR_GRE_restore_the_roman_empire_desc: "Our victories are no longer a dream of revival. From Rome to Constantinople, the Roman Empire lives again."

 RR_GRE_purple_phoenix_1: "Dream of the Purple Phoenix"
 RR_GRE_purple_phoenix_1_desc: "The idea of imperial restoration has returned to public life, but it remains more promise than reality."
 RR_GRE_purple_phoenix_2: "The Purple Phoenix Rises"
 RR_GRE_purple_phoenix_2_desc: "With Constantinople restored as our capital, the imperial project commands growing loyalty at home and abroad."
 RR_GRE_purple_phoenix_3: "Imperial Restoration"
 RR_GRE_purple_phoenix_3_desc: "The recovered provinces provide soldiers, resources, and proof that Roman restoration is irreversible."
 RR_GRE_purple_phoenix_4: "Roma Invicta"
 RR_GRE_purple_phoenix_4_desc: "The empire has survived the centuries and returned victorious. Rome is unconquered."

